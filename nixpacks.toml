[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3080"

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "uv"]

[phases.install]
cmds = ["npm install -g npm@11.10.0", "npm ci --no-audit"]

[phases.build]
cmds = ["npm run frontend", "npm prune --omit=dev", "npm cache clean --force"]

[start]
cmd = "npm run backend"
