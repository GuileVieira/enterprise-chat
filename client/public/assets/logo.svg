<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" fill="none">
  <!-- Icon: stylized "O" with a musical note/wave hint -->
  <g transform="translate(0, 4)">
    <!-- Outer circle -->
    <circle cx="16" cy="16" r="14" stroke="#0f0f0f" stroke-width="2.5" fill="none"/>
    <!-- Inner arc suggesting sound wave / note stem -->
    <path d="M 10 16 Q 16 8, 22 16 Q 16 24, 10 16" stroke="#0f0f0f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Dot / note head -->
    <circle cx="22" cy="16" r="2.5" fill="#0f0f0f"/>
  </g>

  <!-- Wordmark: Orqest -->
  <text x="42" y="28" font-family="Geist, 'Satoshi', 'Cabinet Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#0f0f0f" letter-spacing="-0.02em">
    Orqest
  </text>
</svg>
