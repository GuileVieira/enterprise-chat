# Minimal production config loaded by Docker Compose deployments.
version: 1.3.9
cache: true

interface:
  modelSelect: true
  parameters: false
  presets: false
  runCode: false
  webSearch: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: false
  multiConvo: false
  agents:
    use: true
    create: false
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'google/gemini-3-flash-preview'
          - 'google/gemini-3.1-pro-preview-customtools'
          - 'anthropic/claude-opus-4.7'
        fetch: false
      titleConvo: true
      titleModel: 'google/gemini-3-flash-preview'
      titlePromptTemplate: 'Gere um título curto e descritivo em português do Brasil (PT-BR) para esta conversa com base na mensagem do usuário. O título deve ter entre 3 e 7 palavras, refletir o tema principal e NÃO usar aspas. Responda APENAS com o título, sem explicações.\n\nMensagem do usuário: {input}\n\nResposta do assistente: {output}'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: 'padrao'
      label: 'Padrão (1x)'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3-flash-preview'
      default: true
    - name: 'avancado'
      label: 'Avançado (3x)'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.1-pro-preview-customtools'
    - name: 'especialista'
      label: 'Especialista (5x)'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-opus-4.7'
