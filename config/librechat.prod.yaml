# Minimal production config loaded by Docker Compose deployments.
version: 1.3.9
cache: true

includedTools:
  - calculator
  - tavily_search_results_json
  - fetch_url
  - meta_ads_get_insights
  - meta_ads_budget_manager
  - openrouter_gemini_image_gen

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: '${TAVILY_API_KEY}'

summarization:
  enabled: true
  provider: OpenRouter
  model: google/gemini-3.8-flash

memory:
  disabled: false
  personalize: true

interface:
  modelSelect: true
  parameters: true
  presets: false
  runCode: false
  webSearch: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: false
  metaAds: true
  metaAdsTrafficAgentId: 'agent_qPUED49hR-2e9CLncyY8A'
  multiConvo: false
  agents:
    use: true
    create: true
    share: true
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  fileCitations: true
  skills:
    use: true
    create: true
    share: true
    public: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities:
      [
        'deferred_tools',
        'execute_code',
        'file_search',
        'web_search',
        'actions',
        'tools',
        'artifacts',
        'skills',
      ]

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'openai/gpt-5.6-luna'
          - 'openai/gpt-5.6-terra'
          - 'openai/gpt-5.6-sol'
          - 'anthropic/claude-fable-5.1'
          - 'anthropic/claude-sonnet-5'
          - '~anthropic/claude-sonnet-latest'
          - '~anthropic/claude-opus-latest'
          - 'google/gemini-3.8-flash'
        fetch: false
      titleConvo: true
      titleModel: 'google/gemini-3.8-flash'
      titlePrompt: 'Gere um título curto e descritivo em português do Brasil (PT-BR) para esta conversa. O título deve ter no máximo 5 palavras, sem pontuação, sem aspas e sem explicações. Responda somente com o título.\n\nConversa:\n{convo}'
      titlePromptTemplate: 'Mensagem do usuário: {input}\n\nResposta do assistente: {output}'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: 'padrao'
      label: 'Padrão (1x)'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.8-flash'
        webSearch: true
      default: true
    - name: 'gpt-56-luna'
      label: 'GPT-5.6 Luna (1x)'
      iconURL: 'openAI'
      preset:
        endpoint: 'OpenRouter'
        model: 'openai/gpt-5.6-luna'
        webSearch: true
    - name: 'gpt-56-terra'
      label: 'GPT-5.6 Terra (3x)'
      iconURL: 'openAI'
      preset:
        endpoint: 'OpenRouter'
        model: 'openai/gpt-5.6-terra'
        webSearch: true
    - name: 'gpt-56-sol'
      label: 'GPT-5.6 Sol (5x)'
      iconURL: 'openAI'
      preset:
        endpoint: 'OpenRouter'
        model: 'openai/gpt-5.6-sol'
        webSearch: true
    - name: 'claude-fable-5'
      label: 'Claude Fable 5.1 (10x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-fable-5.1'
        webSearch: true
    - name: 'claude-sonnet-5'
      label: 'Claude Sonnet 5 (2x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-sonnet-5'
        webSearch: true
    - name: 'claude-sonnet-latest'
      label: 'Claude Sonnet Latest (3x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-sonnet-latest'
        webSearch: true
    - name: 'claude-opus-latest'
      label: 'Claude Opus Latest (5x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-opus-latest'
        webSearch: true
    - name: 'gemini-38-flash'
      label: 'Gemini 3.8 Flash (1x)'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.8-flash'
        webSearch: true
