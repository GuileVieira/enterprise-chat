# Minimal production config loaded by Docker Compose deployments.
version: 1.3.9
cache: true

includedTools:
  - calculator
  - meta_ads_get_insights
  - meta_ads_budget_manager
  - openrouter_gemini_image_gen

summarization:
  enabled: true
  provider: OpenRouter
  model: anthropic/claude-haiku-4.5

interface:
  modelSelect: true
  parameters: true
  presets: false
  runCode: false
  webSearch: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: false
  metaAds: true
  multiConvo: false
  agents:
    use: true
    create: true
    share: true
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  fileCitations: true
  skills:
    use: true
    create: true
    share: true
    public: false

mcpServers:
  metaAds:
    type: streamable-http
    url: https://mcp.facebook.com/ads
    serverInstructions: true
    timeout: 60000
    requiresOAuth: true
    oauth:
      authorization_url: https://www.facebook.com/v25.0/dialog/oauth
      token_url: https://graph.facebook.com/v25.0/oauth/access_token
      client_id: '${META_MCP_CLIENT_ID}'
      scope: ads_management ads_read catalog_management business_management pages_show_list instagram_basic
      token_endpoint_auth_methods_supported:
        - none
      code_challenge_methods_supported:
        - S256

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools', 'artifacts', 'skills']

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'anthropic/claude-haiku-4.5'
          - 'openai/gpt-5.5'
          - '~anthropic/claude-sonnet-latest'
          - '~anthropic/claude-opus-latest'
          - 'google/gemini-3.1-pro-preview-customtools'
          - 'google/gemini-3.5-flash'
        fetch: false
      titleConvo: true
      titleModel: 'google/gemini-3.5-flash'
      titlePrompt: 'Gere um título curto e descritivo em português do Brasil (PT-BR) para esta conversa. O título deve ter no máximo 5 palavras, sem pontuação, sem aspas e sem explicações. Responda somente com o título.\n\nConversa:\n{convo}'
      titlePromptTemplate: 'Mensagem do usuário: {input}\n\nResposta do assistente: {output}'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: 'padrao'
      label: 'Padrão (1x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-haiku-4.5'
        webSearch: true
      default: true
    - name: 'gpt-55'
      label: 'GPT-5.5 (5x)'
      iconURL: 'openAI'
      preset:
        endpoint: 'OpenRouter'
        model: 'openai/gpt-5.5'
        webSearch: true
    - name: 'claude-sonnet-latest'
      label: 'Claude Sonnet Latest (3x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-sonnet-latest'
        webSearch: true
    - name: 'claude-opus-latest'
      label: 'Claude Opus Latest (5x)'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-opus-latest'
        webSearch: true
    - name: 'gemini-flash-latest'
      label: 'Gemini Flash Latest (1x)'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.5-flash'
        webSearch: true
    - name: 'gemini-pro-latest'
      label: 'Gemini Pro Latest (3x)'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.1-pro-preview-customtools'
        webSearch: true
