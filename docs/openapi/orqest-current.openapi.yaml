openapi: 3.0.3
info:
  title: Orqest terminal — rotas existentes
  version: 0.1.0
  description: >-
    Inventário OpenAPI verificado no código do commit indicado. Não publica rotas nem comprova
    deploy. Separa sessão JWT, OIDC de gestão e chave de execução tenant. Escopo: leitura de
    agentes/instruções/skills, projetos, prompts, arquivos, tools e dados próprios. Não é uma
    especificação de toda a API Orqest. Rotas futuras estão apenas em
    orqest-integration.proposed.openapi.yaml.
servers:
  - url: /
    description: Origem da instalação Orqest; configurar URL HTTPS real no cliente.
x-orqest-status: implemented-source-only
x-orqest-reviewed-commit: 3896374d1
paths:
  /api/agents/v1/agents:
    get:
      operationId: listManagedAgents
      tags:
        - Agentes e instruções
      summary: Listar agentes cuja configuração o principal pode administrar.
      description: >-
        Listar agentes cuja configuração o principal pode administrar.

        Exige AGENTS USE e AGENT EDIT, ou capacidade administrativa; não equivale a poder executar o
        agente. after é o próximo cursor, enviado como cursor na chamada seguinte.
      security:
        - ManagementOidc: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/agents/reads.ts
        routerFile: api/server/routes/agents/management.js
        route: /
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: Cursor opaco retornado em after. Não construir manualmente.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '401':
          description: Credencial ausente/inválida ou configuração de autenticação desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ou rota não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/agents/v1/agents/{id}:
    get:
      operationId: getManagedAgent
      tags:
        - Agentes e instruções
      summary: Ler configuração do agente, incluindo instructions, tools, skills e tool_resources.
      description: >-
        Ler configuração do agente, incluindo instructions, tools, skills e tool_resources.

        AGENTS USE e AGENT EDIT ou capacidade administrativa. Configuração bruta: não inclui
        automaticamente projeto, memórias resolvidas, catálogo MCP e skills ativadas no turno.
      security:
        - ManagementOidc: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/agents/reads.ts
        routerFile: api/server/routes/agents/management.js
        route: /:id
      parameters:
