openapi: 3.0.3
info:
  title: Orqest terminal — rotas existentes
  version: 0.1.0
  description: >-
    Inventário legado baseado no commit indicado, mais 20 integrações implementadas no worktree
    atual. Não publica rotas nem comprova deploy. Separa sessão JWT, OIDC de gestão e chave de
    execução tenant. Escopo: leitura de agentes/instruções/skills, projetos, prompts, arquivos,
    tools e dados próprios. Não é uma especificação de toda a API Orqest. As 20 integrações novas
    estão implementadas no worktree e detalhadas também em orqest-integration.proposed.openapi.yaml;
    não comprova publicação.
servers:
  - url: /
    description: Origem da instalação Orqest; configurar URL HTTPS real no cliente.
x-orqest-status: implemented-source-only
x-orqest-base-commit: 3896374d1
x-orqest-worktree-changes: true
paths:
  /api/integrations/v1/openapi.json:
    get:
      operationId: externalOpenApi
      tags:
        - documentation
      summary: Recuperar contrato OpenAPI da API REST
      security:
        - TenantExecutionKey: []
        - ManagementOidc: []
      x-orqest-status: implemented
      x-orqest-source:
        file: api/server/routes/integrations.js
        routerFile: api/server/routes/integrations.js
        route: /openapi.json
      responses:
        '200':
          description: Documento OpenAPI 3.0.3 das integrações REST
          content:
            application/json:
              schema:
                type: object
                required:
                  - openapi
                  - info
                  - paths
                properties:
                  openapi:
                    type: string
                    enum:
                      - 3.0.3
                  info:
                    type: object
                  paths:
                    type: object
        '401':
          description: Credencial inválida
        '403':
          description: Política ou tenant negado
  /api/agents/v1/agents:
    get:
      operationId: listManagedAgents
      tags:
        - Agentes e instruções
      summary: Listar agentes cuja configuração o principal pode administrar.
      description: >-
        Listar agentes cuja configuração o principal pode administrar.

        Exige AGENTS USE e AGENT EDIT, ou capacidade administrativa; não equivale a poder executar o
        agente. after é o próximo cursor, enviado como cursor na chamada seguinte.
      security:
        - ManagementOidc: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/agents/reads.ts
        routerFile: api/server/routes/agents/management.js
        route: /
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: Cursor opaco retornado em after. Não construir manualmente.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '401':
          description: Credencial ausente/inválida ou configuração de autenticação desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ou rota não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
