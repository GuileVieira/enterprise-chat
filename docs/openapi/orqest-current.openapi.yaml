                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: number
                  page:
                    type: number
                  limit:
                    type: number
                required:
                  - items
                  - total
                  - page
                  - limit
                additionalProperties: false
        '401':
          description: Credencial ausente/inválida ou configuração de autenticação desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ou rota não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tenant-api-keys:
    get:
      operationId: listBrowserTenantApiKeyMetadata
      tags:
        - Identidade
      summary: Listar IDs e prefixos das chaves de um tenant autorizado.
      description: >-
        Listar IDs e prefixos das chaves de um tenant autorizado.

        OWNER do próprio tenant ou ADMIN no tenant solicitado. Cada chave tem id e pode ser revogada
        separadamente. Não retorna key nem keyHash. Chaves tenant executam como OWNER vinculado, não
        possuem scopes finos por recurso implementados aqui.
      security:
        - BrowserJwt: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/apiKeys/tenant.ts
        routerFile: api/server/routes/tenantApiKeys.js
        route: /
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        keyPrefix:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - name
                        - keyPrefix
                        - createdAt
                      additionalProperties: false
                required:
                  - keys
                additionalProperties: false
        '401':
          description: Credencial ausente/inválida ou configuração de autenticação desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ou rota não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BrowserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de sessão autenticada por requireJwtAuth. Não é uma chave de execução de agente nem
        token Meta. A integração de terminal durável está no contrato proposto.
    ManagementOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token OIDC de máquina, validado por issuer/audience e vínculo clientId →
        userId/tenantId em endpoints.agents.managementApi.auth. Sem fallback para sessão do
        navegador ou chave de execução.
    TenantExecutionKey:
      type: http
      scheme: bearer
      description: >-
        Chave de execução com scope tenant; requireRemoteAgentAuth e feature REMOTE_AGENTS. /catalog
        e /projects ainda exigem req.tenantApiKey, portanto token OIDC de gestão não basta.
  schemas:
    Error:
      type: object
      properties:
        error: {}
        message:
          type: string
        code:
          type: string
      additionalProperties: true
    AgentFile:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - agent.file
        filename:
          type: string
        bytes:
          type: number
        mime_type:
          type: string
        purposes:
          type: array
          items:
            type: string
        created_at:
          type: string
          nullable: true
      required:
        - id
        - object
        - filename
        - bytes
        - mime_type
        - purposes
        - created_at
      additionalProperties: false
    SkillFile:
      type: object
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
      additionalProperties: true
    SkillFileContent:
      allOf:
        - $ref: '#/components/schemas/SkillFile'
        - type: object
          properties:
            content:
              type: string
            isBinary:
              type: boolean
          required:
            - isBinary
          additionalProperties: true
      description: >-
        JSON de arquivo textual. content pode estar ausente para binários/arquivos grandes;
        isBinary=false não garante content presente. Não há download binário nesta superfície.
    Project:
      type: object
      properties:
        _id:
          type: string
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        memories:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
              - key
              - value
            additionalProperties: true
        memoryKeys:
          type: array
          items:
            type: string
        sharedMemoryIds:
          type: array
          items:
            type: string
        promptSnippets:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
            required:
              - title
              - content
            additionalProperties: false
        promptGroupIds:
          type: array
          items:
            type: string
        fileIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
      description: >-
        Campos relevantes do documento atual; a rota retorna também outros campos persistidos. Não é
        uma projeção pública saneada nem uma garantia de contexto efetivo do runtime.
    Prompt:
      type: object
