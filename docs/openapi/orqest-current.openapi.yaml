  /api/agents/v1/skills/{id}/files/{relativePath}:
    get:
      operationId: readManagedSkillTextFile
      tags:
        - Skills
      summary: Ler arquivo textual da skill como JSON.
      description: >-
        Ler arquivo textual da skill como JSON.

        relativePath representa o wildcard Express e pode conter subdiretórios, como
        references/guide.md; preservar barras de separação e escapar cada segmento no cliente. Não
        usar caminho absoluto nem traversal. Parâmetros query são rejeitados; não há raw=1.
        Binários/oversized podem omitir content.
      security:
        - ManagementOidc: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/skills/management.ts
        routerFile: api/server/routes/agents/skills.js
        route: /:id/files/*relativePath
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: relativePath
          in: path
          required: true
          schema:
            type: string
          description: Caminho relativo com possíveis subdiretórios. Não é uma URL ou caminho local.
