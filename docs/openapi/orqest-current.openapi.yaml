      tags:
        - Arquivos
      summary: Baixar conteúdo original, ou texto persistido para source=text.
      description: >-
        Baixar conteúdo original, ou texto persistido para source=text.

        fileAccess valida tenant, dono, projeto ou agente; userId da URL não concede acesso.
        direct=true pode redirecionar para URL assinada. Provedor sem suporte retorna 501; arquivo
        expirado/removido ou credencial indisponível pode impedir recuperação.
      security:
        - BrowserJwt: []
      x-orqest-status: implemented
      x-orqest-source:
        file: api/server/routes/files/files.js
        routerFile: api/server/routes/files/files.js
        route: /download/:userId/:file_id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - name: direct
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            default: 'false'
      responses:
        '200':
          description: Bytes do arquivo; source=text devolve texto UTF-8.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-File-Metadata:
              description: JSON de metadados codificado com encodeURIComponent.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '302':
          description: Redirecionamento opcional para URL assinada.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Arquivo do provedor sem modelo disponível
        '401':
          description: Sessão ausente/inválida
        '403':
          description: Arquivo inacessível ou de outro tenant
        '404':
          description: Arquivo/conteúdo não encontrado
        '500':
          description: Falha no storage/download
        '501':
          description: Storage sem método de download
  /api/files/download-url/{userId}/{file_id}:
    get:
      operationId: getBrowserSignedDownloadUrl
      tags:
        - Arquivos
      summary: Obter URL assinada quando o storage oferece suporte.
      description: >-
        Obter URL assinada quando o storage oferece suporte.

        URL é temporária e deve ser tratada como segredo; Cache-Control no-store. Não existe
        expiresIn padronizado na resposta atual. Fonte sem suporte retorna 501; usar download
        streaming como alternativa.
      security:
        - BrowserJwt: []
      x-orqest-status: implemented
      x-orqest-source:
        file: api/server/routes/files/files.js
        routerFile: api/server/routes/files/files.js
        route: /download-url/:userId/:file_id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  filename:
                    type: string
                  type:
                    type: string
                  metadata:
                    type: object
                    additionalProperties: true
                required:
                  - url
                  - filename
                  - type
                  - metadata
                additionalProperties: false
        '400':
          description: Arquivo do provedor sem modelo disponível
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Credencial ausente/inválida ou configuração de autenticação desabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ou rota não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Storage não fornece URL assinada; usar download streaming quando suportado
          content:
            text/plain:
              schema:
                type: string
