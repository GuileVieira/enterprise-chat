  /api/tenant-api-keys/{id}:
    patch:
      operationId: updateBrowserTenantApiKeyResources
      tags:
        - Identidade
      summary: Atualizar acesso de uma chave tenant
      security:
        - BrowserJwt: []
      x-orqest-status: implemented
      x-orqest-source:
        file: packages/api/src/apiKeys/tenant.ts
        routerFile: api/server/routes/tenantApiKeys.js
        route: /:id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Seleção salva.
        '400':
          description: Seleção inválida ou recursos inacessíveis
        '401':
          description: Sessão inválida
        '403':
          description: Gestão não autorizada neste tenant
        '404':
          description: Chave não encontrada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceAccess
              properties:
                resourceAccess:
                  type: object
                  description: >-
                    Categoria omitida permite todos os recursos autorizados; array vazio não permite
                    nenhum. Chaves restritas usam integrations/v1.
                  properties:
                    agentIds:
                      type: array
                      maxItems: 2000
                      items:
                        type: string
                        minLength: 1
                        maxLength: 512
                    projectIds:
                      type: array
                      maxItems: 2000
                      items:
                        type: string
                        minLength: 1
                        maxLength: 512
                  additionalProperties: false
                  nullable: true
              additionalProperties: false
components:
  securitySchemes:
    BrowserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de sessão autenticada por requireJwtAuth. Não é uma chave de execução de agente nem
        token Meta. A integração de terminal durável está no contrato proposto.
    ManagementOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token OIDC de máquina, validado por issuer/audience e vínculo clientId →
        userId/tenantId em endpoints.agents.managementApi.auth. Sem fallback para sessão do
        navegador ou chave de execução.
    TenantExecutionKey:
      type: http
      scheme: bearer
      description: >-
        Chave de execução com scope tenant; requireRemoteAgentAuth e feature REMOTE_AGENTS. /catalog
        e /projects ainda exigem req.tenantApiKey, portanto token OIDC de gestão não basta.
  schemas:
    Error:
      type: object
      properties:
        error: {}
        message:
          type: string
        code:
          type: string
      additionalProperties: true
    AgentFile:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - agent.file
        filename:
          type: string
        bytes:
          type: number
        mime_type:
          type: string
        purposes:
          type: array
          items:
            type: string
        created_at:
          type: string
          nullable: true
      required:
        - id
        - object
        - filename
        - bytes
        - mime_type
        - purposes
        - created_at
      additionalProperties: false
    SkillFile:
      type: object
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
      additionalProperties: true
    SkillFileContent:
      allOf:
        - $ref: '#/components/schemas/SkillFile'
        - type: object
          properties:
            content:
              type: string
            isBinary:
              type: boolean
          required:
            - isBinary
          additionalProperties: true
      description: >-
        JSON de arquivo textual. content pode estar ausente para binários/arquivos grandes;
        isBinary=false não garante content presente. Não há download binário nesta superfície.
    Project:
      type: object
      properties:
        _id:
          type: string
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        memories:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
              - key
              - value
            additionalProperties: true
        memoryKeys:
          type: array
          items:
            type: string
        sharedMemoryIds:
          type: array
          items:
            type: string
        promptSnippets:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
            required:
              - title
              - content
            additionalProperties: false
        promptGroupIds:
          type: array
          items:
            type: string
        fileIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
      description: >-
        Campos relevantes do documento atual; a rota retorna também outros campos persistidos. Não é
        uma projeção pública saneada nem uma garantia de contexto efetivo do runtime.
    Prompt:
      type: object
      properties:
        _id:
          type: string
        groupId:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum:
            - text
            - chat
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    PromptGroup:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        oneliner:
          type: string
        category:
          type: string
        productionId:
          type: string
        productionPrompt:
          $ref: '#/components/schemas/Prompt'
        command:
          type: string
      additionalProperties: true
    File:
      type: object
      properties:
        file_id:
          type: string
        user:
          type: string
        projectId:
          type: string
        filename:
          type: string
        bytes:
          type: number
        type:
          type: string
        source:
          type: string
        status:
          type: string
        textFormat:
          type: string
          nullable: true
      additionalProperties: true
    Preview:
      type: object
      properties:
        file_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
        text:
          type: string
        textFormat:
          type: string
          nullable: true
        previewError:
          type: string
      required:
        - file_id
        - status
      additionalProperties: false
    ToolMetadata:
      type: object
      properties:
        pluginKey:
          type: string
        name:
          type: string
        description:
          type: string
        authenticated:
          type: boolean
        agentsOnly:
          type: boolean
      additionalProperties: true
    TenantFunction:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        details:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
      additionalProperties: true
    CatalogAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provider:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    CatalogProject:
      type: object
      properties:
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - projectId
        - name
      additionalProperties: false
    UserIdentity:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        role:
          type: string
        tenantId:
          type: string
      additionalProperties: true
    Conversation:
      type: object
      properties:
        conversationId:
