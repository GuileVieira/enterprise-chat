      type: object
      description: >-
        Texto máximo 512 KiB. Binário, texto grande ou storage sem leitor produz complete=false e
        motivo. Erro real de leitura falha, não vira sucesso vazio. SKILL.md representa body_only
        com frontmatter aprovado separado; nunca arquivo original integral.
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
        content:
          type: string
        isBinary:
          type: boolean
        complete:
          type: boolean
        unavailableReason:
          type: string
          enum:
            - binary
            - text_too_large
            - storage_unavailable
        representation:
          type: string
          enum:
            - body_only
        frontmatter:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            argument-hint:
              type: string
            when-to-use:
              type: string
            license:
              type: string
            compatibility:
              type: string
            disableModelInvocation:
              type: boolean
            userInvocable:
              type: boolean
            alwaysApply:
              type: boolean
            allowedTools:
              type: array
              items:
                type: string
          additionalProperties: false
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
        - complete
      additionalProperties: false
    IntegrationPrompt:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        name:
          type: string
        prompt:
          type: string
        type:
          type: string
        production:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - prompt_group
            - project_snippet
        projectId:
          type: string
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - prompt
        - source
      additionalProperties: false
    IntegrationMemory:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
        agentId:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
        source:
          type: string
          enum:
            - personal
            - project
            - shared
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - key
        - value
        - source
      additionalProperties: false
    IntegrationTool:
      type: object
      description: >-
        Exportação exige AGENT EDIT; execução exige autorização REMOTE_AGENT separada. Catálogo
        cache-only para MCP não abre transporte ou OAuth. Efeito desconhecido, credencial ausente e
        lifecycle interativo tornam callable=false antes de efeitos.
      properties:
        name:
          type: string
        description:
          type: string
        family:
          type: string
          enum:
            - builtin
            - tenant_function
            - action
            - mcp
        inputSchema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema efetivo; ausente quando descoberta indisponível, nunca schema vazio
            inventado.
        callable:
          type: boolean
        reason:
          type: string
        effect:
          type: string
          enum:
            - read
            - write
        operationEffects:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        bindProject:
          type: boolean
      required:
        - name
        - description
        - family
        - callable
      additionalProperties: false
    IntegrationToolCall:
      type: object
      description: >-
        Envelope estrito. conversationId, file_ids, entity_id, URLs de RAG e campos de escopo não
        são aceitos. projectId é validado pelo servidor. IDs externos da ferramenta seguem regras de
        domínio do adapter.
      properties:
        agentId:
          type: string
        projectId:
          type: string
        arguments:
          type: object
          additionalProperties: true
      required:
        - agentId
        - arguments
      additionalProperties: false
    IntegrationToolResult:
      type: object
      description: >-
        Escritas exigem Idempotency-Key e reserva Mongo durável; retries revalidam auth/ACL e
        reproduzem estado. in_progress/partial/ambiguous não autorizam novo dispatch. Tombstone da
        chave não é removido após expiração do resultado; retenção do replay 7 dias. Sem promessa
        exactly-once externa.
      properties:
        status:
          type: string
          enum:
            - in_progress
            - completed
            - failed
            - partial
            - ambiguous
        effect:
          type: string
          enum:
            - not_dispatched
            - dispatched
            - completed
            - unknown
        callId:
          type: string
        replayed:
          type: boolean
        resultExpired:
          type: boolean
        data:
          description: >-
            Resultado de domínio projetado e inspecionado do adapter; pode ser texto, objeto ou
            array.
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
        knownIds:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        artifact:
          type: object
          properties:
            file_search:
              $ref: '#/components/schemas/IntegrationFileSearchSources'
          additionalProperties: false
      required:
        - status
        - effect
      additionalProperties: false
    IntegrationConversation:
      type: object
      description: >-
        Somente histórico do principal. Referências a projeto/agente são omitidas quando
        inacessíveis.
      properties:
        id:
          type: string
        title:
          type: string
        projectId:
          type: string
        agentId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
      additionalProperties: false
    IntegrationMessage:
      type: object
      description: >-
        Somente texto explícito. Artifacts, tool calls/outputs, arquivos e mapas livres não são
        exportados. parentMessageId precisa pertencer à mesma conversa e principal.
      properties:
        id:
          type: string
        conversationId:
          type: string
        parentMessageId:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - text
              text:
                type: string
            required:
              - type
              - text
            additionalProperties: false
        createdAt:
          type: string
          format: date-time
        omittedParts:
          type: integer
          minimum: 0
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - conversationId
        - role
        - text
        - content
        - omittedParts
      additionalProperties: false
    IntegrationFileSearchInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Consulta semântica em linguagem natural.
      required:
        - query
      additionalProperties: false
    IntegrationFileSearchSource:
      type: object
      properties:
        type:
          type: string
          enum:
            - file
        fileId:
          type: string
        fileName:
          type: string
        content:
          type: string
        relevance:
          type: number
          description: 1 - distância; não probabilidade.
        pages:
          type: array
          items:
            type: integer
            minimum: 1
        pageRelevance:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          properties:
            imageRag:
              type: object
              properties:
                kind:
                  type: string
                status:
                  type: string
                sourceImageFileName:
                  type: string
              additionalProperties: false
          additionalProperties: false
      required:
        - type
        - fileId
        - fileName
        - content
        - relevance
        - pages
        - pageRelevance
      additionalProperties: false
    IntegrationFileSearchSources:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationFileSearchSource'
          maxItems: 10
      required:
        - sources
      additionalProperties: false
    IntegrationFileSearchResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - empty
            - no_files
            - partial
            - failed
        indexStatus:
          type: string
          enum:
            - index_status_unknown
        sources:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationFileSearchSource'
          maxItems: 10
        failures:
          type: array
          items:
            type: object
            properties:
              fileId:
                type: string
              code:
                type: string
                enum:
                  - rag_auth
                  - unavailable
                  - timeout
                  - cancelled
                  - invalid_response
                  - response_limit
            required:
              - fileId
              - code
            additionalProperties: false
        limits:
          type: object
          properties:
            files:
              type: integer
              minimum: 0
            concurrency:
              type: integer
              minimum: 0
            deadlineMs:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
          required:
            - files
            - concurrency
            - deadlineMs
            - bytes
          additionalProperties: false
      required:
        - status
        - indexStatus
        - sources
        - failures
        - limits
      additionalProperties: false
    IntegrationContext:
      type: object
      description: >-
        Projeção segura e seleção, sem LLM. Fingerprint não é snapshot transacional, autorização ou
        prompt final. Projeto explicitamente pedido e negado falha. Seção opcional negada gera
        warning genérico sem IDs privados. Texto dos arquivos de skills e catálogo de tools são
        buscados nas rotas próprias. Máximo 1 MiB; exceder falha explicitamente, sem truncamento
        silencioso.
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        selection:
          type: object
          properties:
            agentId:
              type: string
            projectId:
              type: string
            include:
              type: array
              items:
                type: string
                enum:
                  - instructions
                  - skills
                  - project
                  - prompts
                  - memories
                  - files
          required:
            - agentId
            - include
          additionalProperties: false
        agent:
          $ref: '#/components/schemas/IntegrationAgent'
        project:
          $ref: '#/components/schemas/IntegrationProject'
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              body:
                type: string
              version:
                type: integer
                minimum: 0
              frontmatter:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  argument-hint:
                    type: string
                  when-to-use:
                    type: string
                  license:
                    type: string
                  compatibility:
                    type: string
                  disableModelInvocation:
                    type: boolean
                  userInvocable:
                    type: boolean
                  alwaysApply:
                    type: boolean
                  allowedTools:
                    type: array
                    items:
                      type: string
                additionalProperties: false
              frontmatterProjection:
                type: string
                enum:
                  - approved_instruction_fields
              source:
                type: string
              fileCount:
                type: integer
                minimum: 0
              alwaysApply:
                type: boolean
              disableModelInvocation:
                type: boolean
              userInvocable:
                type: boolean
              allowedTools:
                type: array
                items:
                  type: string
              updatedAt:
                type: string
                format: date-time
              complete:
                type: boolean
              missingCount:
                type: integer
                minimum: 0
              references:
                type: array
                items:
                  type: object
                  properties:
                    relativePath:
                      type: string
                  required:
                    - relativePath
                  additionalProperties: false
              missingReferences:
                type: array
                items:
                  type: string
            additionalProperties: false
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationPrompt'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationMemory'
        files:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationFile'
        warnings:
          type: array
          items:
            type: string
        complete:
          type: boolean
        contextFingerprint:
          type: string
        fingerprintSemantics:
          type: string
        limits:
          type: object
          properties:
            maxBytes:
              type: integer
              minimum: 0
            skillFiles:
              type: string
            tools:
              type: string
            truncated:
              type: boolean
          required:
            - maxBytes
            - skillFiles
            - tools
            - truncated
          additionalProperties: false
      required:
        - schemaVersion
        - selection
        - agent
        - warnings
        - complete
        - contextFingerprint
        - fingerprintSemantics
        - limits
      additionalProperties: false
    IntegrationKeyResources:
      type: object
      description: >-
        Categoria omitida permite todos os recursos autorizados; array vazio não permite nenhum.
        Chaves restritas usam integrations/v1.
      properties:
        agentIds:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 512
        projectIds:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 512
      additionalProperties: false
