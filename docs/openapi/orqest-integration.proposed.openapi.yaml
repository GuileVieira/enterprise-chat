openapi: 3.0.3
info:
  title: Orqest terminal — contrato proposto
  version: 0.1.0
  description: >-
    PROPOSTA: nenhuma rota deste arquivo está implementada. API de terminal para obter
    instruções/prompts/skills e recuperar chunks de documentos pela tool file_search no escopo
    autorizado do agente/projeto. O cliente externo conduz o raciocínio; a busca não inicia conversa
    com a LLM do agente. Download completo de documentos e binários não faz parte deste escopo.
    Rotas atuais estão em orqest-current.openapi.yaml.
servers:
  - url: /
    description: Origem da instalação Orqest; configurar URL HTTPS real no cliente.
x-orqest-status: proposed-not-implemented
x-orqest-reviewed-commit: 3896374d1
paths:
  /api/integrations/v1/agents:
    get:
      operationId: externalListAgents
      tags:
        - agents
      summary: Listar configurações de agentes exportáveis.
      description: >-
        Listar configurações de agentes exportáveis.

        Não ampliar a política existente de AGENT EDIT/capacidade administrativa para exportar
        instructions.
      x-orqest-status: proposed
      x-orqest-permissions:
        - AGENTS USE
        - AGENT EDIT ou capacidade de gestão
      x-orqest-reuses:
        - packages/api/src/agents/reads.ts
        - packages/api/src/agents/management.ts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: Cursor opaco retornado em after. Não construir manualmente.
      responses:
        '200':
          description: Contrato proposto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                  - data
                  - nextCursor
                additionalProperties: false
        '400':
          description: Argumentos inválidos/conflito de escopo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão/exportação negada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ausente/inacessível no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ferramenta exige runtime, sessão ou aprovação não suportada pelo gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
