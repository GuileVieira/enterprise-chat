  /api/agents/v1/chat/completions:
    post:
      operationId: executeAgentChatCompletion
      tags:
        - execution
      summary: Executar agente e gerar resposta com a LLM configurada no Orqest
      description: >-
        Rota existente fora de integrations/v1. Usa instruções, skills e tools configuradas no agente
        e contexto do projeto autorizado. Consome tokens e pode executar tools com efeitos externos.
        Exige REMOTE_AGENTS USE, autorização REMOTE_AGENT VIEW ou propriedade do agente, API key
        habilitada e PROJECT VIEW quando projectId for enviado. Chaves com agentIds/projectIds
        restritos são recusadas pelo runtime completo; use chave tenant sem seleção personalizada.
        Para manter contexto, envie o histórico em messages a cada chamada. Não aceita o OIDC M2M de
        gestão como alternativa automática.
      security:
        - TenantExecutionKey: []
      x-orqest-status: implemented
      x-orqest-source:
        file: api/server/controllers/agents/openai.js
        routerFile: api/server/routes/agents/openai.js
        route: /chat/completions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: agent_qPUED49hR-2e9CLncyY8A
              messages:
                - role: user
                  content: Analise as campanhas e sugira os próximos passos.
              stream: false
      responses:
        '200':
          description: Resposta gerada; com stream=true, eventos SSE chat.completion.chunk e marcador [DONE].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Pedido inválido ou bloqueado por filtro de conteúdo.
        '401':
          description: Credencial inválida.
        '403':
          description: Execução remota desabilitada, ACL negada, chave restrita ou projeto sem acesso.
        '404':
          description: Agente ou projeto não acessível.
        '429':
          description: Limite atingido.
        '500':
          description: Falha no runtime ou provedor do modelo.
components:
  securitySchemes:
    TenantExecutionKey:
      type: http
      scheme: bearer
      description: >-
        Somente chave tenant existente: OWNER ativo, mesmo tenant/papel, configuração efetiva apiKey
        habilitada. Descoberta e leituras seguem autorização de cada recurso; somente execução de tools
        exige REMOTE_AGENTS USE. Chave individual/sessão do browser não aceita.
    ManagementOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC M2M de gestão: issuer/audience/client binding/subject existentes, principal ativo do
        tenant. Alternativa só nas integrações; gestão legada continua M2M exclusiva. Sem fallback
        após negativa.
  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                type:
                  type: string
              additionalProperties: false
        code:
          type: string
      required:
        - error
      additionalProperties: false
      description: >-
        Erros de integração usam error.code/message. Helpers de autenticação existentes também podem
        devolver error textual ou code externo; nunca tokens ou payloads privados.
    Identity:
      type: object
      properties:
        tenantId:
          type: string
        principalId:
          type: string
        method:
          type: string
          enum:
            - tenant_api_key
            - oidc_m2m
        keyId:
          type: string
        resourceAccess:
          $ref: '#/components/schemas/KeyResources'
      required:
        - tenantId
        - principalId
        - method
      additionalProperties: false
    Agent:
      type: object
      description: >-
        Projeção autorizada para exportação. Omite parâmetros, tool_options, credenciais, subagentes e
        referências não revalidadas. Não é prompt final de um turno.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        provider:
          type: string
        model:
          type: string
        memoryScope:
          type: string
          enum:
            - user
            - agent
        skillsEnabled:
          type: boolean
        skillsScope:
          type: string
          enum:
            - all
            - selected
            - none
        version:
          type: integer
          minimum: 0
        exportable:
          type: boolean
          enum:
            - true
      required:
        - id
        - instructions
        - provider
        - model
        - memoryScope
        - skillsEnabled
        - version
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        updatedAt:
          type: string
          format: date-time
        isArchived:
          type: boolean
      required:
        - id
        - instructions
        - isArchived
      additionalProperties: false
    File:
      type: object
      description: >-
        Inventário sem bytes, URLs ou storage paths. embedded não comprova disponibilidade de
        índice.
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
        embedded:
          type: boolean
        indexStatus:
          type: string
          enum:
            - unknown
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - name
        - embedded
        - indexStatus
      additionalProperties: false
    SkillSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 0
        frontmatterProjection:
          type: string
          enum:
            - approved_instruction_fields
        source:
          type: string
        fileCount:
          type: integer
          minimum: 0
        alwaysApply:
          type: boolean
        disableModelInvocation:
          type: boolean
        userInvocable:
          type: boolean
        allowedTools:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - version
        - source
        - fileCount
        - alwaysApply
        - disableModelInvocation
        - userInvocable
        - allowedTools
        - frontmatterProjection
      additionalProperties: false
    Skill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        body:
          type: string
        version:
          type: integer
          minimum: 0
        frontmatter:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            argument-hint:
              type: string
            when-to-use:
              type: string
            license:
              type: string
            compatibility:
              type: string
            disableModelInvocation:
              type: boolean
            userInvocable:
              type: boolean
            alwaysApply:
              type: boolean
            allowedTools:
              type: array
              items:
                type: string
          additionalProperties: false
        frontmatterProjection:
          type: string
          enum:
            - approved_instruction_fields
        source:
          type: string
        fileCount:
          type: integer
          minimum: 0
        alwaysApply:
          type: boolean
        disableModelInvocation:
          type: boolean
        userInvocable:
          type: boolean
        allowedTools:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - body
        - version
        - frontmatter
        - frontmatterProjection
        - source
        - fileCount
        - alwaysApply
        - disableModelInvocation
        - userInvocable
        - allowedTools
      additionalProperties: false
    SkillReference:
      type: object
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
      additionalProperties: false
    SkillDetail:
      type: object
      description: >-
        complete descreve corpo, inventário esperado e referências textuais reconhecidas. Não afirma
        que todos os arquivos foram recuperados. Frontmatter contém somente campos de instrução
        aprovados; metadata/hooks/ambientes ficam fora.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        body:
          type: string
        version:
          type: integer
          minimum: 0
        frontmatter:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            argument-hint:
              type: string
            when-to-use:
              type: string
            license:
              type: string
            compatibility:
              type: string
            disableModelInvocation:
              type: boolean
            userInvocable:
              type: boolean
            alwaysApply:
              type: boolean
            allowedTools:
              type: array
              items:
                type: string
          additionalProperties: false
        frontmatterProjection:
          type: string
          enum:
            - approved_instruction_fields
        source:
          type: string
        fileCount:
          type: integer
          minimum: 0
        alwaysApply:
          type: boolean
        disableModelInvocation:
          type: boolean
        userInvocable:
          type: boolean
        allowedTools:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
        references:
          type: array
          items:
            $ref: '#/components/schemas/SkillReference'
        declaredReferences:
          type: array
          items:
            type: string
        missingReferences:
          type: array
          items:
            type: string
        referenceCoverage:
          type: string
          enum:
            - markdown_file_links_and_safe_frontmatter_paths
        completeProjection:
          type: string
          enum:
            - body_inventory_and_file_references
        complete:
          type: boolean
        completeness:
          type: object
          properties:
            body:
              type: boolean
            inventory:
              type: boolean
            textFiles:
              type: string
              enum:
                - retrieve_separately
            missingCount:
              type: integer
              minimum: 0
            missingReferences:
              type: array
              items:
                type: string
          required:
            - body
            - inventory
            - textFiles
            - missingCount
            - missingReferences
          additionalProperties: false
      required:
        - id
        - body
        - frontmatter
        - references
        - declaredReferences
        - missingReferences
        - referenceCoverage
        - completeProjection
        - complete
        - completeness
      additionalProperties: false
    SkillFileContent:
      type: object
      description: >-
        Texto máximo 512 KiB. Binário, texto grande ou storage sem leitor produz complete=false e
        motivo. Erro real de leitura falha, não vira sucesso vazio. SKILL.md representa body_only
        com frontmatter aprovado separado; nunca arquivo original integral.
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
        content:
          type: string
        isBinary:
          type: boolean
        complete:
          type: boolean
        unavailableReason:
          type: string
          enum:
            - binary
            - text_too_large
            - storage_unavailable
        representation:
          type: string
          enum:
            - body_only
        frontmatter:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            argument-hint:
              type: string
            when-to-use:
              type: string
            license:
              type: string
            compatibility:
              type: string
            disableModelInvocation:
              type: boolean
            userInvocable:
              type: boolean
            alwaysApply:
              type: boolean
            allowedTools:
              type: array
              items:
                type: string
          additionalProperties: false
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
        - complete
      additionalProperties: false
    Prompt:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        name:
          type: string
        prompt:
          type: string
        type:
          type: string
        production:
          type: boolean
        updatedAt:
          type: string
          format: date-time
