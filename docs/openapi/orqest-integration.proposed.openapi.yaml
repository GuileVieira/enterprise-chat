          type: string
          enum:
            - personal
            - project
            - shared
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - key
        - value
        - source
      additionalProperties: false
    Tool:
      type: object
      description: >-
        Exportação exige AGENT EDIT; execução exige autorização REMOTE_AGENT separada. Catálogo
        cache-only para MCP não abre transporte ou OAuth. Efeito desconhecido, credencial ausente e
        lifecycle interativo tornam callable=false antes de efeitos.
      properties:
        name:
          type: string
        description:
          type: string
        family:
          type: string
          enum:
            - builtin
            - tenant_function
            - action
            - mcp
        inputSchema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema efetivo; ausente quando descoberta indisponível, nunca schema vazio
            inventado.
        callable:
          type: boolean
        reason:
          type: string
        effect:
          type: string
          enum:
            - read
            - write
        operationEffects:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        bindProject:
          type: boolean
      required:
        - name
        - description
        - family
        - callable
      additionalProperties: false
    ToolCall:
      type: object
      description: >-
        Envelope estrito. conversationId, file_ids, entity_id, URLs de RAG e campos de escopo não
        são aceitos. projectId é validado pelo servidor. IDs externos da ferramenta seguem regras de
        domínio do adapter.
      properties:
        agentId:
          type: string
        projectId:
          type: string
        arguments:
          type: object
          additionalProperties: true
      required:
        - agentId
        - arguments
      additionalProperties: false
    ToolResult:
      type: object
      description: >-
        Escritas exigem Idempotency-Key e reserva Mongo durável; retries revalidam auth/ACL e
        reproduzem estado. in_progress/partial/ambiguous não autorizam novo dispatch. Tombstone da
        chave não é removido após expiração do resultado; retenção do replay 7 dias. Sem promessa
        exactly-once externa.
      properties:
        status:
          type: string
          enum:
            - in_progress
            - completed
            - failed
            - partial
            - ambiguous
        effect:
          type: string
          enum:
            - not_dispatched
            - dispatched
            - completed
            - unknown
        callId:
          type: string
        replayed:
          type: boolean
        resultExpired:
          type: boolean
        data:
          description: >-
            Resultado de domínio projetado e inspecionado do adapter; pode ser texto, objeto ou
            array.
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
        knownIds:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        artifact:
          type: object
          properties:
            file_search:
              $ref: '#/components/schemas/FileSearchSources'
          additionalProperties: false
      required:
        - status
        - effect
      additionalProperties: false
    Conversation:
      type: object
      description: >-
        Somente histórico do principal. Referências a projeto/agente são omitidas quando
        inacessíveis.
      properties:
        id:
          type: string
        title:
          type: string
        projectId:
          type: string
        agentId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
      additionalProperties: false
    Message:
      type: object
      description: >-
        Somente texto explícito. Artifacts, tool calls/outputs, arquivos e mapas livres não são
        exportados. parentMessageId precisa pertencer à mesma conversa e principal.
      properties:
        id:
          type: string
        conversationId:
          type: string
        parentMessageId:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - text
              text:
                type: string
            required:
              - type
              - text
            additionalProperties: false
        createdAt:
          type: string
          format: date-time
        omittedParts:
          type: integer
          minimum: 0
        contentFilterBlocked:
          type: boolean
      required:
        - id
        - conversationId
        - role
        - text
        - content
        - omittedParts
      additionalProperties: false
    FileSearchInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Consulta semântica em linguagem natural.
      required:
        - query
      additionalProperties: false
    FileSearchSource:
      type: object
      properties:
        type:
          type: string
          enum:
            - file
        fileId:
          type: string
        fileName:
          type: string
        content:
          type: string
        relevance:
          type: number
          description: 1 - distância; não probabilidade.
        pages:
          type: array
          items:
            type: integer
            minimum: 1
        pageRelevance:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          properties:
            imageRag:
              type: object
              properties:
                kind:
                  type: string
                status:
                  type: string
                sourceImageFileName:
                  type: string
              additionalProperties: false
          additionalProperties: false
      required:
        - type
        - fileId
        - fileName
        - content
        - relevance
        - pages
        - pageRelevance
      additionalProperties: false
    FileSearchSources:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FileSearchSource'
          maxItems: 10
      required:
        - sources
      additionalProperties: false
    FileSearchResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - empty
            - no_files
            - partial
            - failed
        indexStatus:
          type: string
          enum:
            - index_status_unknown
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FileSearchSource'
          maxItems: 10
        failures:
          type: array
          items:
            type: object
            properties:
              fileId:
                type: string
              code:
                type: string
                enum:
                  - rag_auth
                  - unavailable
                  - timeout
                  - cancelled
                  - invalid_response
                  - response_limit
            required:
              - fileId
              - code
            additionalProperties: false
        limits:
          type: object
          properties:
            files:
              type: integer
              minimum: 0
            concurrency:
              type: integer
              minimum: 0
            deadlineMs:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
          required:
            - files
            - concurrency
            - deadlineMs
            - bytes
          additionalProperties: false
      required:
        - status
        - indexStatus
        - sources
        - failures
        - limits
      additionalProperties: false
    Context:
      type: object
      description: >-
        Projeção segura e seleção, sem LLM. Fingerprint não é snapshot transacional, autorização ou
        prompt final. Projeto explicitamente pedido e negado falha. Seção opcional negada gera
        warning genérico sem IDs privados. Texto dos arquivos de skills e catálogo de tools são
        buscados nas rotas próprias. Máximo 1 MiB; exceder falha explicitamente, sem truncamento
        silencioso.
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        selection:
          type: object
          properties:
            agentId:
              type: string
            projectId:
              type: string
            include:
              type: array
              items:
                type: string
                enum:
                  - instructions
                  - skills
                  - project
                  - prompts
                  - memories
                  - files
          required:
            - agentId
            - include
          additionalProperties: false
        agent:
          $ref: '#/components/schemas/Agent'
        project:
          $ref: '#/components/schemas/Project'
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              body:
                type: string
              version:
                type: integer
                minimum: 0
              frontmatter:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  argument-hint:
                    type: string
                  when-to-use:
                    type: string
                  license:
                    type: string
                  compatibility:
                    type: string
                  disableModelInvocation:
                    type: boolean
                  userInvocable:
                    type: boolean
                  alwaysApply:
                    type: boolean
                  allowedTools:
                    type: array
                    items:
                      type: string
                additionalProperties: false
              frontmatterProjection:
                type: string
                enum:
                  - approved_instruction_fields
              source:
                type: string
              fileCount:
                type: integer
                minimum: 0
              alwaysApply:
                type: boolean
              disableModelInvocation:
                type: boolean
              userInvocable:
                type: boolean
              allowedTools:
                type: array
                items:
                  type: string
              updatedAt:
                type: string
                format: date-time
              complete:
                type: boolean
              missingCount:
                type: integer
                minimum: 0
              references:
                type: array
                items:
                  type: object
                  properties:
                    relativePath:
                      type: string
                  required:
                    - relativePath
                  additionalProperties: false
              missingReferences:
                type: array
                items:
                  type: string
            additionalProperties: false
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/Prompt'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        warnings:
          type: array
          items:
            type: string
        complete:
          type: boolean
        contextFingerprint:
          type: string
        fingerprintSemantics:
          type: string
        limits:
          type: object
          properties:
            maxBytes:
              type: integer
              minimum: 0
            skillFiles:
              type: string
            tools:
              type: string
            truncated:
              type: boolean
          required:
            - maxBytes
            - skillFiles
            - tools
            - truncated
          additionalProperties: false
      required:
        - schemaVersion
        - selection
        - agent
        - warnings
        - complete
        - contextFingerprint
        - fingerprintSemantics
        - limits
      additionalProperties: false
    KeyResources:
      type: object
      description: >-
        Categoria omitida permite todos os recursos autorizados; array vazio não permite nenhum.
        Chaves restritas usam integrations/v1.
      properties:
        agentIds:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 512
        projectIds:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 512
      additionalProperties: false
    AgentSummary:
      type: object
      description: 'Agente com VIEW sem EDIT: metadados visíveis; instruções e contexto não exportáveis.'
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provider:
          type: string
        model:
          type: string
        exportable:
          type: boolean
          enum:
            - false
      required:
        - id
        - provider
        - model
        - exportable
      additionalProperties: false
    AgentListEntry:
      oneOf:
        - $ref: '#/components/schemas/Agent'
        - $ref: '#/components/schemas/AgentSummary'
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
          description: ID do agente, não o nome do modelo do provedor.
        messages:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - system
                  - user
                  - assistant
                  - tool
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
              tool_call_id:
                type: string
              tool_calls:
                type: array
                items:
                  type: object
                  additionalProperties: true
            required:
              - role
            additionalProperties: true
        stream:
          type: boolean
          default: false
        projectId:
          type: string
        conversation_id:
          type: string
        parent_message_id:
          type: string
      required:
        - model
        - messages
      additionalProperties: true
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
                    nullable: true
                additionalProperties: true
              finish_reason:
                type: string
                nullable: true
            required:
              - index
              - message
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true
      required:
        - id
        - object
        - created
        - model
        - choices
      additionalProperties: true

security:
  - TenantExecutionKey: []
  - ManagementOidc: []
