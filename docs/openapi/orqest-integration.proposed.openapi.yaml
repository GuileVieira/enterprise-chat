  /api/integrations/v1/agents/{id}/context:
    get:
      operationId: externalGetAgentContext
      tags:
        - agents
      summary: Exportar contexto estruturado de agente/projeto sem executar LLM.
      description: >-
        Exportar contexto estruturado de agente/projeto sem executar LLM.

        Resolver ACL antes de carregar dados. Incluir instructions, snippets/grupos autorizados,
        skills com body/frontmatter, schemas de tools e metadados de arquivos elegíveis para busca
        por chunks. skills_enabled, skills_scope, alwaysApply e partições de memória continuam
        aplicáveis; retornar warnings para indisponibilidades permitidas, não conteúdo de recurso
        negado. instructionSections é composição identificada, não promessa de reproduzir todo
        prompt dinâmico de uma conversa. fingerprint muda com versões dos recursos, não revela
        segredos.

        Contexto deve fornecer schema de file_search e inventário autorizado. Não incluir todos os
        documentos na íntegra: cliente consulta chunks por demanda.
      x-orqest-status: proposed
      x-orqest-permissions:
        - AGENT EDIT/exportação
        - PROJECT VIEW se projectId
        - SKILL VIEW/USE
        - PROMPTGROUP VIEW/herdado
        - MEMORY READ por partição
      x-orqest-reuses:
        - api/server/services/Projects/context.js
        - packages/api/src/agents/context.ts
        - packages/api/src/agents/skills.ts
        - packages/api/src/skills/management.ts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
