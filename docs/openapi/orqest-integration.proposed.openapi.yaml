openapi: 3.0.3
info:
  title: Orqest terminal — integrações implementadas no código
  version: 1.0.0
  description: >-
    20 operações de integração, documentação e execução de agente implementadas no código. Não comprova
    deploy/configuração da instalação. Terminal conduz raciocínio; Orqest fornece
    instruções/contexto e executa adapters; /api/agents/v1/chat/completions executa a LLM do agente. Filename .proposed
    preservado por compatibilidade dos links. Sem download integral RAG nem transporte interativo
    fictício.
servers:
  - url: /
    description: Origem da instalação; configure URL HTTPS real.
x-orqest-status: implemented-source-only
x-orqest-base-commit: 3896374d1
x-orqest-worktree-changes: true
