components:
  securitySchemes:
    TenantExecutionKey:
      type: http
      scheme: bearer
      description: >-
        Chave de execução com scope tenant; requireRemoteAgentAuth e feature REMOTE_AGENTS. /catalog
        e /projects ainda exigem req.tenantApiKey, portanto token OIDC de gestão não basta.
    ManagementOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token OIDC de máquina, validado por issuer/audience e vínculo clientId →
        userId/tenantId em endpoints.agents.managementApi.auth. Sem fallback para sessão do
        navegador ou chave de execução.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Agent:
      type: object
      description: >-
        Projeção proposta para contexto externo. Omite model_parameters, tool_options, git_identity
        e configurações de ambientes; não repassar mapas livres de configuração/credenciais.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        tools:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        skills_enabled:
          type: boolean
        skills_scope:
          type: string
          enum:
            - all
            - selected
            - none
        memory_scope:
          type: string
          enum:
            - user
            - agent
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              to:
                anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              description:
                type: string
              edgeType:
                type: string
                enum:
                  - handoff
                  - direct
              prompt:
                anyOf:
                  - type: string
              excludeResults:
                type: boolean
              promptKey:
                type: string
            required:
              - from
              - to
            additionalProperties: false
        tool_resources:
          type: object
          properties:
            image_edit:
              type: object
              properties:
                file_ids:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            execute_code:
              $ref: '#/components/schemas/Agent/properties/tool_resources/properties/image_edit'
            file_search:
              type: object
              properties:
                file_ids:
                  $ref: >-
                    #/components/schemas/Agent/properties/tool_resources/properties/image_edit/properties/file_ids
                vector_store_ids:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            context:
              $ref: '#/components/schemas/Agent/properties/tool_resources/properties/image_edit'
            ocr:
              $ref: '#/components/schemas/Agent/properties/tool_resources/properties/image_edit'
          additionalProperties: false
        subagents:
          type: object
          properties:
            enabled:
              type: boolean
            allowSelf:
              type: boolean
            agent_ids:
              type: array
              items:
                type: string
            graphs:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  agent_ids:
                    type: array
                    items:
                      type: string
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                        to:
                          anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                        description:
                          type: string
                        edgeType:
                          type: string
                          enum:
                            - direct
                        prompt:
                          type: string
                        excludeResults:
                          type: boolean
                      required:
                        - from
                        - to
                        - edgeType
                      additionalProperties: false
                  entry_agent_id:
                    type: string
                  result_agent_id:
                    type: string
                required:
                  - type
                  - name
                  - description
                  - agent_ids
                  - edges
                  - entry_agent_id
                  - result_agent_id
                additionalProperties: false
          additionalProperties: false
        provider:
          type: string
        model:
          type: string
          nullable: true
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          $ref: '#/components/schemas/Agent/properties/createdAt'
      required:
        - provider
        - model
        - id
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
    Skill:
      type: object
      properties:
        name:
          type: string
        displayTitle:
          type: string
        description:
          type: string
        category:
          type: string
        alwaysApply:
          type: boolean
        id:
          type: string
          pattern: ^[a-f\d]{24}$
        version:
          type: integer
          exclusiveMinimum: true
          minimum: 0
        fileCount:
          type: integer
          minimum: 0
        disableModelInvocation:
          type: boolean
        userInvocable:
          type: boolean
        allowedTools:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        body:
          type: string
        frontmatter:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
              - enum:
                  - 'null'
                nullable: true
              - type: array
                items:
                  $ref: '#/components/schemas/Skill/properties/frontmatter/additionalProperties'
              - type: object
                additionalProperties:
                  $ref: '#/components/schemas/Skill/properties/frontmatter/additionalProperties'
      required:
        - name
        - description
        - id
        - version
        - fileCount
        - createdAt
        - updatedAt
        - body
      additionalProperties: false
    SkillFile:
      type: object
      properties:
        relativePath:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
      required:
        - relativePath
        - filename
        - mimeType
        - bytes
      additionalProperties: true
    SkillFileContent:
      allOf:
        - $ref: '#/components/schemas/SkillFile'
        - type: object
          properties:
            content:
              type: string
            isBinary:
              type: boolean
          required:
            - isBinary
          additionalProperties: true
      description: >-
        JSON de arquivo textual. content pode estar ausente para binários/arquivos grandes;
        isBinary=false não garante content presente. Não há download binário nesta superfície.
    SkillSummary:
      type: object
      properties:
        name:
          type: string
        displayTitle:
          type: string
        description:
          type: string
        category:
          type: string
        alwaysApply:
          type: boolean
        id:
          type: string
          pattern: ^[a-f\d]{24}$
        version:
          type: integer
          exclusiveMinimum: true
          minimum: 0
        fileCount:
          type: integer
          minimum: 0
        disableModelInvocation:
          type: boolean
        userInvocable:
          type: boolean
        allowedTools:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - description
        - id
        - version
        - fileCount
        - createdAt
        - updatedAt
      additionalProperties: false
      description: Lista retorna resumo. Para body/frontmatter usar GET /api/agents/v1/skills/{id}.
    File:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          minimum: 0
        embedded:
          type: boolean
          nullable: true
      required:
        - id
        - filename
        - mimeType
        - bytes
      additionalProperties: false
      description: >-
        Metadados de documento para descoberta/escopo de busca. Não retorna bytes, texto integral,
        URL de download ou caminho de storage. embedded não garante disponibilidade do índice RAG no
        momento da consulta.
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        promptSnippets:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
            required:
              - title
              - content
            additionalProperties: false
        promptGroupIds:
          type: array
          items:
            type: string
        fileIds:
          type: array
          items:
            type: string
        sharedMemoryIds:
          type: array
          items:
            type: string
      required:
        - id
        - name
      additionalProperties: false
    Prompt:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        content:
          type: string
        type:
          type: string
          enum:
            - text
            - chat
        versionId:
          type: string
      required:
        - id
        - groupId
        - content
        - type
      additionalProperties: false
    PromptGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        productionId:
          type: string
          nullable: true
      required:
        - id
        - name
        - productionId
      additionalProperties: false
    Memory:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
        source:
          type: string
          enum:
            - personal
            - agent
            - project
            - shared
        agentId:
          type: string
          nullable: true
        projectId:
          type: string
          nullable: true
      required:
        - id
        - key
        - value
        - source
      additionalProperties: false
    Tool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum:
            - builtin
            - mcp
            - action
            - tenant_function
        inputSchema:
          type: object
          additionalProperties: true
        callable:
          type: boolean
        unavailableReason:
          type: string
          nullable: true
        requiresProject:
          type: boolean
        requiresConversation:
          type: boolean
      required:
        - name
        - description
        - kind
        - inputSchema
        - callable
        - unavailableReason
        - requiresProject
        - requiresConversation
      additionalProperties: false
    ToolCall:
      type: object
      properties:
        agentId:
          type: string
        projectId:
          type: string
        conversationId:
          type: string
        arguments:
          type: object
          additionalProperties: true
      required:
        - agentId
        - arguments
      additionalProperties: false
    ToolResult:
      type: object
      properties:
        callId:
          type: string
        status:
          type: string
          enum:
            - completed
            - failed
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/File'
        error:
          type: object
          allOf:
            - $ref: '#/components/schemas/Error'
          nullable: true
        artifact:
          type: object
          properties:
            file_search:
              $ref: '#/components/schemas/FileSearchSources'
          additionalProperties: true
          description: >-
            Preservar artifact estruturado da tool. Para file_search, usar
            artifact.file_search.sources; não reduzir a resposta a texto formatado ou arquivo para
            download.
      required:
        - callId
        - status
        - content
        - artifacts
      additionalProperties: false
    Context:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        project:
          type: object
          allOf:
            - $ref: '#/components/schemas/Project'
          nullable: true
        promptGroups:
          type: array
          items:
            $ref: '#/components/schemas/PromptGroup'
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/Prompt'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        instructionSections:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - agent
                  - project
                  - prompt
                  - skill
                  - mcp
                  - memory
              sourceId:
                type: string
                nullable: true
              text:
                type: string
            required:
              - source
              - sourceId
              - text
            additionalProperties: false
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              resourceId:
                type: string
                nullable: true
              message:
                type: string
            required:
              - code
              - message
            additionalProperties: false
        contextFingerprint:
          type: string
      required:
        - agent
        - project
        - promptGroups
        - prompts
        - skills
        - tools
        - files
        - memories
        - instructionSections
        - warnings
        - contextFingerprint
      additionalProperties: false
    Conversation:
      type: object
      properties:
        conversationId:
          type: string
        projectId:
          type: string
          nullable: true
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    Message:
      type: object
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        text:
          type: string
        content:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    FileSearchInput:
      type: object
      properties:
        query:
          type: string
          description: >-
            A natural language query to search for relevant information in the files. Be specific
            and use keywords related to the information you're looking for. The query will be used
            for semantic similarity matching against the file contents.
      required:
        - query
      additionalProperties: false
    FileSearchSource:
      type: object
      properties:
        type:
          type: string
          enum:
            - file
        fileId:
          type: string
        fileName:
          type: string
        content:
          type: string
        relevance:
          type: number
          description: >-
            Valor atual da tool: 1 - distância vetorial. Não é probabilidade e não possui garantia
            universal de intervalo 0..1.
        pages:
          type: array
          items:
            type: integer
            minimum: 1
        pageRelevance:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          properties:
            imageRag:
              type: object
              properties:
                sourceImageFileId:
                  type: string
                sourceImageFileName:
                  type: string
                derivedTextFileId:
                  type: string
              additionalProperties: false
          additionalProperties: false
      required:
        - type
        - fileId
        - fileName
        - content
        - relevance
        - pages
        - pageRelevance
      additionalProperties: false
      description: >-
        Um chunk retornado pela tool atual. pages pode estar vazio; não inventar página, chunkId
        estável, offsets ou score de probabilidade. Metadados opcionais de imagem devem passar por
        projeção segura.
    FileSearchSources:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FileSearchSource'
          maxItems: 10
        fileCitations:
          type: boolean
      required:
        - sources
        - fileCitations
      additionalProperties: false
      description: >-
        Forma do artifact.file_search atual: até 10 fontes globais, ordenadas por distância. Busca
        atual pede k=5 por arquivo; os argumentos públicos da tool contêm apenas query.
    FileSearchArtifact:
      type: object
      properties:
        file_search:
          $ref: '#/components/schemas/FileSearchSources'
      required:
        - file_search
      additionalProperties: false
security:
  - TenantExecutionKey: []
  - ManagementOidc: []
