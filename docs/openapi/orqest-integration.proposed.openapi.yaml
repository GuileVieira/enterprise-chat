  /api/integrations/v1/tools/{toolName}/call:
    post:
      operationId: externalCallAgentTool
      tags:
        - tools
      summary: Executar tool permitida sem inferência do Orqest.
      description: >-
        Executar tool permitida sem inferência do Orqest.

        Reusar loader e validação existentes, nunca instanciar tool arbitrária só pelo nome.
        Vincular principal/agentId/projectId; rejeitar IDs de escopo divergentes em arguments.
        Preservar controles de escrita, quotas, políticas e lifecycle de aprovação. Tools sem
        suporte direto retornam 409/runtime_required antes de efeitos. Respostas de falha parcial
        informam efeitos/IDs para evitar repetição automática.

        Prioridade: file_search com arguments={query}. Preparar o recurso com primeFiles e contexto
        ACL validado no servidor, chamar createFileSearchTool e serializar conteúdo+artifact. Não
        permitir que argumentos forneçam entity_id, projectFileIds ou file_ids que ampliem escopo.
        RAG_API_URL e JWT interno permanecem no servidor. Não iniciar chat/completions para executar
        a busca; embeddings/RAG continuam sendo usados pela tool.
      x-orqest-status: proposed
      x-orqest-permissions:
        - AGENT autorização
        - PROJECT VIEW/EDIT conforme ação
        - permissões específicas da tool
      x-orqest-reuses:
        - api/app/clients/tools/util/handleTools.js
        - api/server/controllers/tools.js
        - api/app/clients/tools/structured/MetaAdsBudgetManager.js
        - api/app/clients/tools/util/fileSearch.js
        - api/server/services/Files/permissions.js
        - api/server/services/Projects/context.js
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: >-
            Para escritas: vincular ao principal/agentId/projectId/tool e hash dos argumentos;
            conflito de reutilização deve retornar 409. Persistir resultado/estado, não executar de
            novo após timeout incerto.
      responses:
        '200':
          description: Contrato proposto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              examples:
                fileSearch:
                  summary: Conteúdo e fontes de chunks retornados pela tool
                  value:
                    callId: call-1
                    status: completed
                    content:
                      - type: text
                        text: |
                          File: contrato.pdf
                          Anchor: \ue202turn0file0 (contrato.pdf)
                          Relevance: 0.8700
                          Content: Cancelamentos devem ser solicitados com 30 dias de antecedência.
                    artifacts: []
                    artifact:
                      file_search:
                        sources:
                          - type: file
                            fileId: file-1
                            fileName: contrato.pdf
                            content: Cancelamentos devem ser solicitados com 30 dias de antecedência.
                            relevance: 0.87
                            pages:
                              - 3
                            pageRelevance:
                              '3': 0.87
                        fileCitations: true
        '400':
          description: Argumentos inválidos/conflito de escopo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão/exportação negada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ausente/inacessível no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ferramenta exige runtime, sessão ou aprovação não suportada pelo gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falha interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCall'
            examples:
              fileSearch:
                summary: Buscar chunks sem recuperar arquivo completo
                value:
                  agentId: agent-1
                  projectId: project-1
                  arguments:
                    query: Qual a política de cancelamento prevista no contrato?
      x-orqest-release-blockers:
        - >-
          Definir allowlist por capability; aprovação/interactive/background não podem ser
          ignorados.
        - Validar ownership e escopo tanto no gateway quanto na tool.
        - Idempotência de escritas e tratamento explícito de falhas parciais.
        - >-
          Distinguir busca vazia de RAG indisponível, não indexado ou falha parcial; a tool atual
          usa mensagens textuais em alguns erros.
        - >-
          Limitar fan-out por arquivo e duração da busca; o cliente não pode elevar k ou escopo com
          argumentos extras.
      x-orqest-file-search:
        state: proposed
        toolName: file_search
        input:
          $ref: '#/components/schemas/FileSearchInput'
        artifact:
          $ref: '#/components/schemas/FileSearchArtifact'
        currentImplementation: api/app/clients/tools/util/fileSearch.js
        currentLimits:
          perFileK: 5
          globalSources: 10
        prerequisites:
          - principal/tenant válidos
          - agente autorizado e file_search habilitada
          - FILE_SEARCH USE
          - PROJECT VIEW quando a busca incluir o projeto
          - arquivos elegíveis e índice RAG disponível
