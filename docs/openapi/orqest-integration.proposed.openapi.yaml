              schema:
                $ref: '#/components/schemas/Context'
        '400':
          description: Argumentos inválidos/conflito de escopo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permissão/exportação negada
          content:
            application/json:
              schema:
